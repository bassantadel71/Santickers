<header class="sticky top-0 z-40 border-b border-border/70 bg-cream/85 backdrop-blur-xl">
  <div
    class="mx-auto grid max-w-7xl grid-cols-[minmax(0,1fr)_auto] items-center gap-4 px-4 py-3 sm:px-6 lg:grid-cols-[auto_1fr_auto]"
  >
    <a routerLink="/" class="min-w-0 shrink-0">
      <app-wordmark className="text-2xl sm:text-3xl" />
    </a>

    <nav class="hidden justify-center gap-1 lg:flex">
      @for (l of links; track l.to) {
        <a
          [routerLink]="l.to"
          routerLinkActive="bg-peach text-navy"
          [routerLinkActiveOptions]="{ exact: l.to === '/' }"
          class="rounded-full px-4 py-2 font-bold text-navy/80 transition hover:bg-beige"
        >
          {{ l.label }}
        </a>
      }
    </nav>

    <div class="flex items-center gap-1.5 sm:gap-2">
      <a
        routerLink="/stickers"
        aria-label="Search stickers"
        class="grid h-10 w-10 place-items-center rounded-full text-navy transition hover:bg-beige"
      >
        <lucide-angular [img]="SearchIcon" class="h-5 w-5" />
      </a>
      <a
        routerLink="/favorites"
        aria-label="Favorites"
        class="relative grid h-10 w-10 place-items-center rounded-full text-navy transition hover:bg-beige"
      >
        <lucide-angular [img]="HeartIcon" class="h-5 w-5" />
        @if (favs.favorites().length > 0) {
          <span
            class="absolute -right-0.5 -top-0.5 grid h-5 min-w-5 place-items-center rounded-full bg-peach px-1 text-[11px] font-extrabold text-navy"
          >
            {{ favs.favorites().length }}
          </span>
        }
      </a>
      <button
        type="button"
        (click)="cart.openCart()"
        aria-label="Open cart"
        class="relative grid h-10 w-10 place-items-center rounded-full text-navy transition hover:bg-beige"
      >
        <lucide-angular [img]="ShoppingBagIcon" class="h-5 w-5" />
        @if (cart.cartCount() > 0) {
          <span
            class="absolute -right-0.5 -top-0.5 grid h-5 min-w-5 place-items-center rounded-full bg-blue px-1 text-[11px] font-extrabold text-cream"
          >
            {{ cart.cartCount() }}
          </span>
        }
      </button>
      <button
        type="button"
        class="hidden items-center gap-2 rounded-full bg-navy px-4 py-2 text-sm font-extrabold text-cream transition hover:bg-blue sm:inline-flex"
      >
        <lucide-angular [img]="UserIcon" class="h-4 w-4" /> Login
      </button>
      <button
        type="button"
        (click)="toggleMenu()"
        aria-label="Toggle menu"
        class="grid h-10 w-10 place-items-center rounded-full bg-beige text-navy lg:hidden"
      >
        <lucide-angular [img]="open() ? XIcon : MenuIcon" class="h-5 w-5" />
      </button>
    </div>
  </div>

  @if (open()) {
    <nav class="border-t border-border bg-cream px-4 pb-5 pt-3 lg:hidden">
      <div class="flex flex-col gap-1">
        @for (l of links; track l.to) {
          <a
            [routerLink]="l.to"
            (click)="closeMenu()"
            routerLinkActive="bg-peach"
            [routerLinkActiveOptions]="{ exact: l.to === '/' }"
            class="rounded-2xl px-4 py-3 font-extrabold text-navy transition hover:bg-beige"
          >
            {{ l.label }}
          </a>
        }
        <button
          type="button"
          class="mt-2 inline-flex items-center justify-center gap-2 rounded-full bg-navy px-4 py-3 font-extrabold text-cream"
        >
          <lucide-angular [img]="UserIcon" class="h-4 w-4" /> Login
        </button>
      </div>
    </nav>
  }
</header>
