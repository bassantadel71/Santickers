<div class="peel-card group relative flex flex-col rounded-3xl bg-card p-4 shadow-[var(--shadow-soft)] ring-1 ring-border/60 transition-all duration-300 hover:-translate-y-1.5 hover:shadow-[var(--shadow-sticker)]">
  <button
    type="button"
    [attr.aria-label]="isFavorite() ? 'Remove from favorites' : 'Add to favorites'"
    (click)="toggleFavorite()"
    [disabled]="isPending()"
    class="absolute left-4 top-4 z-10 grid h-10 w-10 place-items-center rounded-full bg-cream/90 text-navy shadow-[var(--shadow-soft)] transition hover:scale-110 disabled:pointer-events-none disabled:opacity-60"
  >
    <lucide-angular [img]="HeartIcon" class="h-5 w-5" [class.fill-peach]="isFavorite()" [class.text-peach]="isFavorite()" />
  </button>

  <a
    [routerLink]="['/stickers', sticker.id]"
    class="relative grid aspect-square place-items-center rounded-[1.6rem] bg-beige/70 p-6"
  >
    <img
      [src]="imageUrl()"
      [alt]="sticker.name"
      loading="lazy"
      width="768"
      height="768"
      class="sticker-shadow h-full w-full object-contain transition-transform duration-500 group-hover:scale-110 group-hover:-rotate-3"
    />
  </a>

  <div class="mt-4 flex items-start justify-between gap-3">
    <div class="min-w-0">
      <p class="text-xs font-bold uppercase tracking-widest text-blue/70">{{ sticker.categoryName }}</p>
      <h3 class="truncate text-lg text-navy">{{ sticker.name }}</h3>
    </div>
    <span class="shrink-0 rounded-full bg-peach px-3 py-1 text-sm font-extrabold text-navy">{{ money(sticker.price) }}</span>
  </div>

  <button
    type="button"
    [disabled]="!sticker.isAvailable"
    (click)="addToCart()"
    class="mt-4 inline-flex w-[calc(100%-2.5rem)] items-center justify-center gap-2 rounded-full bg-navy px-4 py-2.5 text-sm font-extrabold text-cream transition hover:bg-blue active:scale-[0.98] disabled:pointer-events-none disabled:opacity-50"
  >
    <lucide-angular [img]="ShoppingBagIcon" class="h-4 w-4" />
    {{ sticker.isAvailable ? 'Add to Cart' : 'Not Available' }}
  </button>
</div>
