<label class="block">
  <span class="text-sm font-extrabold text-navy">{{ label }}</span>
  <span class="relative mt-1.5 flex items-center">
    <lucide-angular
      [img]="icon"
      class="pointer-events-none absolute left-3 top-1/2 h-4.5 w-4.5 -translate-y-1/2 text-navy/50"
    />
    <input
      [type]="type"
      [placeholder]="placeholder"
      class="w-full rounded-full border border-border bg-beige/70 py-3 pl-13 pr-4 text-navy placeholder:text-navy/40 outline-none ring-peach/60 transition focus:bg-cream focus:ring-2"
    />
    @if (toggleable) {
      <button
        type="button"
        class="absolute right-4 top-1/2 -translate-y-1/2 text-navy/50 hover:text-navy"
        aria-label="Toggle password visibility"
      >
        <lucide-angular [img]="icon" class="h-4.5 w-4.5" />
      </button>
    }
  </span>
</label>
