<div class="mx-auto flex min-h-svh w-full max-w-6xl flex-col items-center justify-center gap-8 px-4 pb-4 pt-6 sm:gap-10 sm:px-6 sm:pb-6 lg:flex-row lg:items-center lg:justify-center lg:pt-0">

  <div class="relative order-2 flex h-auto w-full max-w-md shrink-0 flex-col justify-center rounded-[28px] bg-cream p-6 shadow-[var(--shadow-sticker)] sm:p-8 lg:order-1">
    <div class="absolute bottom-0 left-0 h-11 w-11 rounded-tr-[28px]"
         style="background: linear-gradient(45deg, var(--beige) 0%, var(--cream) 45%, color-mix(in oklab, var(--navy) 12%, transparent) 100%);"></div>

    <p class="text-xs font-extrabold uppercase tracking-wide text-peach">Create your account</p>
    <h1 class="mt-1 text-3xl text-navy">Join Santickers</h1>

    <form class="mt-6 space-y-5">
      <label class="block">
        <span class="text-sm font-extrabold text-navy">Full name</span>
        <span class="relative mt-1.5 flex items-center">
          <lucide-angular [img]="UserIcon" class="pointer-events-none absolute left-3 top-1/2 h-4.5 w-4.5 -translate-y-1/2 text-navy/50" />
          <input type="text" placeholder="Your full name"
                 class="w-full rounded-full border border-border bg-beige/70 py-3 pl-13 pr-4 text-navy outline-none ring-peach/60 transition focus:bg-cream focus:ring-2" />
        </span>
      </label>

      <label class="block">
        <span class="text-sm font-extrabold text-navy">Email</span>
        <span class="relative mt-1.5 flex items-center">
          <lucide-angular [img]="MailIcon" class="pointer-events-none absolute left-3 top-1/2 h-4.5 w-4.5 -translate-y-1/2 text-navy/50" />
          <input type="email" placeholder="you@email.com"
                 class="w-full rounded-full border border-border bg-beige/70 py-3 pl-13 pr-4 text-navy outline-none ring-peach/60 transition focus:bg-cream focus:ring-2" />
        </span>
      </label>

      <label class="block">
        <span class="text-sm font-extrabold text-navy">Password</span>
        <span class="relative mt-1.5 flex items-center">
          <lucide-angular [img]="LockIcon" class="pointer-events-none absolute left-3 top-1/2 h-4.5 w-4.5 -translate-y-1/2 text-navy/50" />
          <input [type]="showPassword() ? 'text' : 'password'" placeholder="••••••••"
                 class="w-full rounded-full border border-border bg-beige/70 py-3 pl-13 pr-13 text-navy outline-none ring-peach/60 transition focus:bg-cream focus:ring-2" />
          <button type="button" (click)="showPassword.set(!showPassword())" aria-label="Toggle password visibility"
                  class="absolute right-4 top-1/2 -translate-y-1/2 text-navy/50 hover:text-navy">
            <lucide-angular [img]="showPassword() ? EyeOffIcon : EyeIcon" class="h-4.5 w-4.5" />
          </button>
        </span>
      </label>

      <label class="block">
        <span class="text-sm font-extrabold text-navy">Confirm password</span>
        <span class="relative mt-1.5 flex items-center">
          <lucide-angular [img]="LockIcon" class="pointer-events-none absolute left-3 top-1/2 h-4.5 w-4.5 -translate-y-1/2 text-navy/50" />
          <input [type]="showConfirm() ? 'text' : 'password'" placeholder="••••••••"
                 class="w-full rounded-full border border-border bg-beige/70 py-3 pl-13 pr-13 text-navy outline-none ring-peach/60 transition focus:bg-cream focus:ring-2" />
          <button type="button" (click)="showConfirm.set(!showConfirm())" aria-label="Toggle password visibility"
                  class="absolute right-4 top-1/2 -translate-y-1/2 text-navy/50 hover:text-navy">
            <lucide-angular [img]="showConfirm() ? EyeOffIcon : EyeIcon" class="h-4.5 w-4.5" />
          </button>
        </span>
      </label>

      <button type="submit"
              class="w-full rounded-full bg-peach py-3.5 font-extrabold text-navy shadow-[0_6px_0_var(--navy)] transition active:translate-y-0.5 active:shadow-[0_2px_0_var(--navy)]">
        Create account
      </button>
    </form>

    <p class="mt-4 text-center text-navy/70">
      Already have an account?
      <a routerLink="/login" class="font-extrabold text-blue hover:underline">Log in</a>
    </p>
  </div>

  <div class="order-1 flex w-full max-w-xl justify-center lg:order-2 lg:w-1/2 lg:max-w-none">
    <app-auth-illustration
      heading="Ready to Create?"
      subtext="Pick up right where you left off — your custom stickers, cart, and favorites are waiting for you."
    />
  </div>
</div>
